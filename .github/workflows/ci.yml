# Prácticas 13 y 14 – Integración continua de Concertx.
# Se ejecuta en cada push y en cada pull request. Dos trabajos en paralelo:
#   1) App móvil Flutter (concertx_movil): dependencias, análisis estático y pruebas.
#   2) Backend Express (backend): dependencias, lint (ESLint) y pruebas Jest con cobertura.
# Las pruebas de test/p12 no se ejecutan aquí: llaman a la API de producción (Vercel) y crean usuarios.
name: CI Concertx

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-flutter:
    name: App móvil (Flutter) – análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: concertx_movil
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Pruebas unitarias, de integración y de persistencia
        run: |
          flutter test test/*.dart test/whitebox test/p13 \
            --reporter expanded \
            --file-reporter json:resultados_flutter.json

      - name: Resumen de pruebas Flutter
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          nombres, ok, fallidas, ms = {}, 0, [], 0
          for linea in open('resultados_flutter.json', encoding='utf-8'):
              e = json.loads(linea)
              if e.get('type') == 'testStart':
                  nombres[e['test']['id']] = e['test']['name']
              elif e.get('type') == 'testDone' and not e.get('hidden'):
                  if e['result'] == 'success': ok += 1
                  else: fallidas.append(nombres[e['testID']])
              elif e.get('type') == 'done':
                  ms = e['time']
          print('### App Flutter')
          print(f'- Aprobadas: {ok}')
          print(f'- Fallidas: {len(fallidas)}')
          print(f'- Tiempo de la suite: {ms/1000:.1f} s')
          for n in fallidas: print(f'  - FALLÓ: {n}')
          PY

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-flutter
          path: concertx_movil/resultados_flutter.json

  backend:
    name: Backend (Node.js) – lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Pruebas Jest con cobertura
        run: npx jest --coverage --ci --json --outputFile=resultados_jest.json

      - name: Resumen de pruebas Jest
        if: always()
        run: |
          node -e "
          const r = require('./resultados_jest.json');
          const fallidas = r.testResults.flatMap(s => s.assertionResults).filter(a => a.status === 'failed');
          const seg = (Math.max(...r.testResults.map(s => s.endTime)) - r.startTime) / 1000;
          console.log('### Backend Jest');
          console.log('- Aprobadas: ' + r.numPassedTests);
          console.log('- Fallidas: ' + r.numFailedTests);
          console.log('- Tiempo de la suite: ' + seg.toFixed(1) + ' s');
          fallidas.forEach(a => console.log('  - FALLÓ: ' + a.fullName));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-backend
          path: |
            backend/coverage/coverage-summary.json
            backend/resultados_jest.json
