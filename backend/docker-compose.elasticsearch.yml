# Elasticsearch local para desarrollo:
#   docker compose -f docker-compose.elasticsearch.yml up -d
#   (en .env) ELASTICSEARCH_URL=http://localhost:9200
#   npm run es:indexar
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: concertx-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-datos:/usr/share/elasticsearch/data
volumes:
  es-datos:
