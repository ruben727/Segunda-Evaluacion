<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' https://fonts.googleapis.com;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
             font-src https://fonts.gstatic.com;
             connect-src 'self' http://localhost:3000 ws://localhost:3000;
             img-src 'self' data:;
             media-src 'self'" />
  <title>Concertx TV — Sin conexión</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline-wrap {
      text-align: center;
    }
    .offline-note {
      font-size: 5rem;
      color: var(--blue);
      margin-bottom: 1.5rem;
    }
    .offline-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 3rem;
      color: var(--text-primary);
      margin: 0 0 0.5rem;
    }
    .offline-subtitle {
      font-size: 2rem;
      color: var(--text-secondary);
      margin: 0 0 1rem;
    }
    .offline-hint {
      font-size: 1.5rem;
      color: var(--text-secondary);
      max-width: 42rem;
      margin: 0 auto 2rem;
    }
    .pulse-dot {
      width: 1.5rem;
      height: 1.5rem;
      margin: 0 auto;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.8); opacity: 0.6; }
      50%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-note">♪</div>
    <h1 class="offline-title">Concertx TV</h1>
    <p class="offline-subtitle">Sin conexión</p>
    <p class="offline-hint">La pantalla se actualizará automáticamente cuando se restablezca la red.</p>
    <div class="pulse-dot" aria-hidden="true"></div>
  </div>
  <script>
    // Reintenta recargar la app cada 10s hasta que vuelva la red.
    setTimeout(() => location.reload(), 10000);
  </script>
</body>
</html>
